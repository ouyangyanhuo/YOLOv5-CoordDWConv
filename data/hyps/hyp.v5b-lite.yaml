# 学习率 - 回归原始
lr0: 0.01                 # 你的原始值
lrf: 0.01                 
momentum: 0.937
weight_decay: 0.0005      # 你的原始值

warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# 损失权重 - 微调
box: 0.06                 # 略微提高
cls: 0.55                 # 略微提高
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.2
anchor_t: 4.0
fl_gamma: 0.0

# 数据增强 - 略微增强
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.03               # 轻微加入
copy_paste: 0.0